name: FLEIJA Tier 1 clean main review
on:
  push:
    branches: ['feature/fleija-tier1-five-city-main-review']
    paths: ['.github/workflows/fleija-tier1-main-review.yml']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify every generated browser bundle matches source
        run: node tools/build_sources.cjs --check
      - name: Run isolated threshold, save/load and integrated attack tests
        run: node --test tests/fleija-tier1-after-five.test.cjs tests/fleija-tier1-milestone-sim.test.cjs
      - name: Compare all full-suite test failures against exact starting main
        shell: bash
        run: |
          set -uo pipefail
          node --test tests/*.test.cjs > /tmp/pr-tier1-full-suite.tap 2>&1
          pr_status=$?
          git worktree add --detach ../tier1-review-base 85bbdfe735d0460057fb0ea7c7081f51b6cccf9a
          (cd ../tier1-review-base && node --test tests/*.test.cjs) > /tmp/main-baseline-full-suite.tap 2>&1
          base_status=$?
          PR_STATUS="$pr_status" BASE_STATUS="$base_status" node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const failed=text=>[...text.matchAll(/^not ok \d+ - (.+)$/gm)].map(x=>x[1]).sort();
          const baseline=failed(fs.readFileSync('/tmp/main-baseline-full-suite.tap','utf8'));
          const review=failed(fs.readFileSync('/tmp/pr-tier1-full-suite.tap','utf8'));
          const unexpected=review.filter(x=>!baseline.includes(x));
          console.log('MAIN_BASELINE_REGRESSION_COMPARISON '+JSON.stringify({
            baselineExit:+process.env.BASE_STATUS,reviewExit:+process.env.PR_STATUS,
            baselineFailures:baseline,reviewFailures:review,newFailures:unexpected
          }));
          assert.equal(unexpected.length,0,'PR introduces new failures not present in starting main');
          assert.ok(review.length===0||baseline.length>0,'Failures must be present on original main');
          if(+process.env.PR_STATUS!==0 && review.length===0)
            throw Error('Full PR suite exited unsuccessfully without a parsed test failure');
          if(+process.env.BASE_STATUS!==0 && baseline.length===0)
            throw Error('Original main suite exited unsuccessfully without a parsed test failure');
          NODE
      - name: Browser HUD UI smoke
        run: node tests/ui-smoke.cjs
  long-war:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [401,777]
    name: 'Long 2017 AI war seed ${{ matrix.seed }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run live-main equal-AI 2017 conquest stability check
        env:
          SEED: ${{ matrix.seed }}
        run: |
          node tools/balance_sim.cjs --runs 1 --players britannia --difficulties normal --max-turns 95 --equal-ai --quiet --seed "$SEED" --output /tmp/fleija-main-review-$SEED.json --summary /tmp/fleija-main-review-$SEED.md
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const seed=process.env.SEED;
          const report=JSON.parse(fs.readFileSync('/tmp/fleija-main-review-'+seed+'.json','utf8'));
          const rows=report.results;
          assert.equal(rows.length,1);
          const row=rows[0];
          assert.ok(row.turnsPlayed>0,'conquest advanced');
          console.log('FLEIJA_MAIN_REVIEW_WAR '+JSON.stringify({
            seed:+seed,turns:row.turnsPlayed,winner:row.winner||null,
            strikes:row.actions?.strikes||null,
            finalCities:row.final?.cities||null
          }));
          NODE
