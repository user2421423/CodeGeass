name: Eliminator relay handoff validation
on:
  push:
    branches: ['feature/eliminator-strategic-ai']
    paths:
      - '.github/workflows/eliminator-relay-check.yml'
permissions:
  contents: read
jobs:
  validate-relays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Confirm source/build synchronization
        run: node tools/build_sources.cjs --check
      - name: Test relay pickup, handoff, secrecy and survival
        run: node --test tests/eliminator-carriers.test.cjs
      - name: Check game smoke
        run: node tests/ui-smoke.cjs
