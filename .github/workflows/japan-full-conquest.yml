name: Japan full-conquest AI benchmark
on:
  push:
    branches: ['feature/japan-endgame-amphibious-ai-20261011']
    paths:
      - 'src/ai/**'
      - 'src/engine/**'
      - 'dist/engine.js'
      - 'dist/engine/ai.js'
      - 'tests/scenario.test.cjs'
      - 'tools/japan_conquest_sim.cjs'
      - '.github/workflows/japan-full-conquest.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: Base seed for the 45 matched games
        default: '246801'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate generated sources
        run: node tools/build_sources.cjs --check
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Browser smoke tests
        run: node tests/ui-smoke.cjs
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        version: [baseline, experimental]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 15 matched all-AI games through turn 150
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.version }}" = "baseline" ]; then
            git worktree add --detach /tmp/japan-baseline 3c6449f29b85a5b9591c093b766f009b7a02eb40
            cp tools/japan_conquest_sim.cjs /tmp/japan-baseline/tools/japan_conquest_sim.cjs
            cd /tmp/japan-baseline
          fi
          BENCHMARK_VERSION="${{ matrix.version }}" node tools/japan_conquest_sim.cjs \
            --runs 15 --offset $((15 * ${{ matrix.shard }})) --max-turns 150 \
            --seed ${{ inputs.seed || '246801' }} --output "$GITHUB_WORKSPACE/results-${{ matrix.version }}-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: japan-${{ matrix.version }}-${{ matrix.shard }}
          path: results-${{ matrix.version }}-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: error
  compare:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: japan-*
          path: downloaded
          merge-multiple: true
      - name: Compare matched full-conquest games
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'downloaded';
          const files = fs.readdirSync(path).filter(n => n.endsWith('.json'));
          for (const version of ['baseline', 'experimental']) {
            const results = files.filter(n => n.includes('-' + version + '-'))
              .flatMap(n => JSON.parse(fs.readFileSync(path + '/' + n)).results)
              .sort((a,b) => a.index - b.index);
            const completed = results.filter(r => r.completed);
            const avg = xs => xs.length ? +(xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(2) : null;
            const med = xs => { const a=xs.slice().sort((x,y)=>x-y);
              return !a.length ? null : a.length%2 ? a[(a.length-1)/2] : (a[a.length/2-1]+a[a.length/2])/2; };
            const record = {
              version, games:results.length, completed: completed.length,
              unresolved:results.length-completed.length,
              winnerCounts:Object.fromEntries(['britannia','bk','cf'].map(s=>[s,completed.filter(r=>r.winner===s).length])),
              avgWinTurn:avg(completed.map(r=>r.winTurn)),
              medianWinTurn:med(completed.map(r=>r.winTurn)),
              turn25CityCounts:Object.fromEntries(['britannia','bk','cf'].map(s=>[s,avg(results.map(r=>r.snapshots[25]?.cities[s]).filter(Number.isFinite))])),
              turn50CityCounts:Object.fromEntries(['britannia','bk','cf'].map(s=>[s,avg(results.map(r=>r.snapshots[50]?.cities[s]).filter(Number.isFinite))])),
              avgLeader25:avg(results.map(r=>r.snapshots[25]?.leader).filter(Number.isFinite)),
              avgLeader50:avg(results.map(r=>r.snapshots[50]?.leader).filter(Number.isFinite)),
              captures25:avg(results.map(r=>r.snapshots[25]?.captures).filter(Number.isFinite)),
              captures50:avg(results.map(r=>r.snapshots[50]?.captures).filter(Number.isFinite)),
              distinctCities:avg(results.map(r=>r.distinctCities)),
              recaptures:avg(results.map(r=>r.recaptures)),
              losses:avg(results.map(r=>Object.values(r.formationLosses).reduce((a,b)=>a+b,0))),
              stalled20Plus:results.filter(r=>!r.completed && r.turnsWithoutCapture >=20).length
            };
            console.log('BENCHMARK COMPARISON '+JSON.stringify(record));
          }
          NODE
