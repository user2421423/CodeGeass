name: Three-faction World Campaign save compatibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/war-campaign.js'
      - 'dist/ui/war-campaign-screen.js'
      - 'dist/war-campaign.css'
      - 'tools/three_faction_campaign_smoke.cjs'
      - 'tools/three_faction_ui_smoke.cjs'
      - '.github/workflows/three-faction-campaign.yml'
permissions:
  contents: read
jobs:
  legacy-save-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build game
        run: node tools/build_sources.cjs
      - name: Check parsed campaign and UI scripts
        run: |
          node --check dist/war-campaign.js
          node --check dist/ui/war-campaign-screen.js
