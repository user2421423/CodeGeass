name: EU-Federation campaign architecture

on:
  push:
    branches:
      - feature/eu-vs-federation-campaign-architecture
  pull_request:
    branches:
      - main
      - feature/eu-vs-federation-campaign-architecture

jobs:
  architecture-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify World Campaign and campaign map JavaScript syntax
        run: |
          node --check dist/war-campaign.js
          node --check dist/ui/war-campaign-screen.js
      - name: Validate EU-Federation architecture, placeholder safety and old saves
        run: node tools/eu_federation_campaign_smoke.cjs
