name: Operation Stonehenge scenario
on:
  pull_request:
    paths:
      - 'dist/scenarios-stonehenge.js'
      - 'tools/scenario_sim.cjs'
      - 'src/ai/**'
      - 'src/engine/**'
      - 'dist/engine.js'
      - 'dist/engine/ai.js'
      - 'dist/ui/scenario-screens.js'
      - 'dist/index.html'
      - '.github/workflows/operation-stonehenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        player: [britannia, eu]
        difficulty: [normal, hard, challenge, elite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Seeded six-turn AI combat and amphibious performance
        run: for seed in 11 71; do node tools/scenario_sim.cjs operation-stonehenge ${{ matrix.player }} ${{ matrix.difficulty }} "$seed" 6; done
