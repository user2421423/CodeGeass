name: Operation Stonehenge scenario
on:
  push:
    branches: ['scenario/operation-stonehenge']
  pull_request:
    paths:
      - 'dist/scenarios-stonehenge.js'
      - 'tools/stonehenge_sim.cjs'
      - 'src/ai/**'
      - 'src/engine/**'
      - 'dist/engine.js'
      - 'dist/engine/ai.js'
      - 'dist/ui/scenario-screens.js'
      - 'dist/index.html'
      - '.github/workflows/operation-stonehenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build_sources.cjs --check
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        player: [britannia, eb, eu]
        difficulty: [normal, hard, challenge, elite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seeded six-turn AI combat and amphibious performance
        run: node tools/stonehenge_sim.cjs 6 ${{ matrix.player }} ${{ matrix.difficulty }}
