name: Saitama Story Mode
on:
  pull_request:
    paths:
      - 'src/missions/**'
      - 'dist/campaign.js'
      - 'tools/test_saitama_mission.cjs'
      - '.github/workflows/saitama-mission.yml'
  push:
    branches: [main]
    paths:
      - 'src/missions/**'
      - 'dist/campaign.js'
      - 'tools/test_saitama_mission.cjs'
      - '.github/workflows/saitama-mission.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source bundles
        run: node tools/build_sources.cjs