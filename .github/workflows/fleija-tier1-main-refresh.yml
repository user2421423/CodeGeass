name: FLEIJA Tier 1 main refresh validation
on:
  push:
    branches:
      - integration/fleija-tier1-pr81-main-refresh
      - feature/fleija-tier1-five-city-main-review
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  source-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build source-only bundles
        run: node tools/build_sources.cjs
      - name: Execute five Tier 1 milestones, legality and save/load tests
        run: node --test tests/fleija-tier1-after-five.test.cjs tests/fleija-tier1-milestone-sim.test.cjs
      - name: Compare full Node suite against base main (no new failures)
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node --test tests/*.test.cjs > /tmp/tier1-head-tests.tap 2>&1
          head_exit=$?
          git worktree add --detach ../tier1-main-before-feature a317db9c703782d02923fee6faf23d0cce9f676e
          (cd ../tier1-main-before-feature && node tools/build_sources.cjs && node --test tests/*.test.cjs) > /tmp/tier1-base-tests.tap 2>&1
          base_exit=$?
          HEAD_EXIT="$head_exit" BASE_EXIT="$base_exit" node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const errors=text=>[...text.matchAll(/^not ok [0-9]+ - (.+)$/gm)].map(x=>x[1]).sort();
          const h=errors(fs.readFileSync('/tmp/tier1-head-tests.tap','utf8'));
          const b=errors(fs.readFileSync('/tmp/tier1-base-tests.tap','utf8'));
          const added=h.filter(e=>!b.includes(e));
          console.log('TIER1_MAIN_REFRESH_BASELINE '+JSON.stringify({headExit:+process.env.HEAD_EXIT,
            baseExit:+process.env.BASE_EXIT,headFailures:h,baseFailures:b,newFailures:added}));
          assert.equal(added.length,0,'New regression test failures were introduced');
          if(+process.env.HEAD_EXIT!==0)assert.ok(h.length,'Unexplained unsuccessful head test process');
          if(+process.env.BASE_EXIT!==0)assert.ok(b.length,'Unexplained unsuccessful baseline test process');
          NODE
  sample-conquest:
    needs: source-and-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [401, 777]
    name: '2017 current-main AI seed ${{ matrix.seed }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/build_sources.cjs
      - name: Verify current-main 2017 AI plays a long war without exceptions
        env:
          SEED: ${{ matrix.seed }}
        shell: bash
        run: |
          node tools/balance_sim.cjs --runs 1 --players britannia --difficulties normal --max-turns 70 --equal-ai --quiet --seed "$SEED" --output /tmp/tier1-refresh-$SEED.json --summary /tmp/tier1-refresh-$SEED.md
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const seed=process.env.SEED;
          const data=JSON.parse(fs.readFileSync('/tmp/tier1-refresh-'+seed+'.json','utf8'));
          assert.equal(data.results.length,1);
          assert.ok(data.results[0].turnsPlayed>=1);
          console.log('TIER1_REFRESH_WAR '+JSON.stringify({seed,turns:data.results[0].turnsPlayed,
            winner:data.results[0].winner,warheads:data.results[0].actions?.strikes}));
          NODE
