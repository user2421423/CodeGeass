name: Scenario Dynamic Defense Branch Checks
on:
  push:
    branches:
      - feature/scenario-dynamic-defense-20261018
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source bundles
        run: node tools/build_sources.cjs
      - name: Validate AI syntax
        run: node --check dist/engine/ai.js
      - name: Dynamic defense regression
        run: node tools/scenario_dynamic_defense_smoke.cjs
      - name: Australia short AI-vs-AI simulation
        run: node tools/scenario_sim.cjs war-for-australia britannia normal 11 2
      - name: Scenario registration and baseline short simulation
        run: node tools/scenario_sim.cjs --all 13 1 war-for-australia
      - name: Division of Japan normal simulation
        run: node tools/scenario_sim.cjs division-japan britannia normal 17 2
      - name: European War hard simulation
        run: node tools/scenario_sim.cjs european-war eu hard 17 2
      - name: Invasion of Japan challenge simulation
        run: node tools/scenario_sim.cjs invasion-japan britannia challenge 17 2
      - name: Philippines island-defense simulation
        run: node tools/scenario_sim.cjs philippines-invasion cf normal 17 2
