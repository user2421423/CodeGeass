name: Commander roster deployments
on:
  push:
    branches: ['feature/full-commander-deployments-20261012']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synchronized source bundles
        run: node tools/build_sources.cjs --check
      - name: Run tests for all modes and deployments
        run: node --test tests/*.test.cjs
      - name: Run UI and asset validation
        run: |
          node tests/ui-smoke.cjs
          node tools/validate_assets.cjs --tracked
          python3 tools/check_map.py
