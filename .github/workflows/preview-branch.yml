name: Preview branch build
# Checks a preview/* branch; on success the Pages workflow on main publishes it at /previews/<name>/.
on:
  push:
    branches: ['preview/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Check published artwork
        run: node tools/validate_assets.cjs --tracked
      - name: Check Challenge Pass scripts and regression tests
        run: |
          node --check dist/engine.js
          node --check dist/ui/challenge-pass.js
          node --check dist/ui/core.js
          node --check dist/ui/turns.js
          node --check dist/ui/input.js
          node tools/challenge_pass_smoke.cjs
