name: Isolated Greenland playable preview
on:
  push:
    branches: [scenario/eu-greenland]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: greenland-preview
      url: ${{ steps.deployment.outputs.page_url }}previews/greenland/
    steps:
      - name: Checkout Greenland branch
        uses: actions/checkout@v4
        with:
          path: greenland-src
      - name: Checkout production main without modifying it
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Check existing source build and Greenland scenario syntax
        working-directory: greenland-src
        run: |
          node tools/build_sources.cjs
          node --check dist/scenarios-greenland.js
          node --check dist/ui/geography.js
          node -e "const E=require('./dist/engine.js');require('./dist/engine/ai.js');const G=require('./dist/scenarios-greenland.js');for(const side of G.sides){for(const d of ['normal','hard','challenge','elite']){const g=G.create(side,d,11);if(g.stations.length!==18||g.stations.filter(s=>s.portAt).length!==15||G.winner(g))process.exit(1);} }"
      - name: Preserve main production site and include isolated preview
        run: |
          mkdir -p main-site/dist/previews/greenland
          cp -a greenland-src/dist/. main-site/dist/previews/greenland/
          git -C greenland-src rev-parse HEAD > main-site/dist/previews/greenland/preview-commit.txt
          test -f main-site/dist/index.html
          test -f main-site/dist/previews/greenland/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
