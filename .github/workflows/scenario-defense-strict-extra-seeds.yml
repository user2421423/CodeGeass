name: Strict AI Extended Scenario Validation
on:
  push:
    branches: [feature/scenario-dynamic-defense-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - { id: division-japan, player: britannia, difficulty: hard, turns: 50 }
          - { id: invasion-japan, player: britannia, difficulty: challenge, turns: 50 }
          - { id: european-war, player: eu, difficulty: normal, turns: 35 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccc1d988ca2e27fbd3179ade3b183b11f04a46b7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build strict default
        run: |
          node tools/build_sources.cjs
          node --check dist/engine/ai.js
          node tools/scenario_dynamic_defense_smoke.cjs
      - name: Six additional strict AI seeds
        env:
          ID: ${{ matrix.scenario.id }}
          PLAYER: ${{ matrix.scenario.player }}
          DIFFICULTY: ${{ matrix.scenario.difficulty }}
          TURNS: ${{ matrix.scenario.turns }}
        run: |
          for SEED in 101 137 211 307 409 503; do
            AI_VERSION=strict node tools/scenario_ai_eval.cjs "$ID" "$PLAYER" "$DIFFICULTY" "$SEED" "$TURNS"
          done
