name: Temporary map visual review
on:
  push:
    branches: [feature/map-hex-alignment]
    paths: [.github/workflows/temporary-map-visual-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle exact reviewed branch
        run: |
          mkdir -p review
          tar --exclude='.git' --exclude=review -czf review/codegeass-map-review.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: codegeass-map-final-browser-review
          path: review/codegeass-map-review.tar.gz
