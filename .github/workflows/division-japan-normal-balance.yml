name: Division Japan Normal Britannia rebalance comparison
on:
  push:
    branches: ['feature/division-japan-britannia-normal-balance-20261013']
    paths:
      - 'dist/scenarios-division-japan.js'
      - 'src/ai/**'
      - 'dist/engine/ai.js'
      - 'tests/division-japan.test.cjs'
      - 'tools/division_japan_balance_sim.cjs'
      - '.github/workflows/division-japan-normal-balance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated AI matches source
        run: node tools/build_sources.cjs --check
      - name: Run Division and scenario regression tests
        run: node --test tests/division-japan.test.cjs tests/scenario.test.cjs
      - name: Smoke-test actual-engine simulation
        run: node tools/division_japan_balance_sim.cjs britannia normal 11 2 sanity.json
  compare:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant: [baseline, rebalance]
        player: [britannia, eu, cf]
    env:
      VERSION: ${{ matrix.variant }}
      PLAYER: ${{ matrix.player }}
      BASE_SHA: 2394d4ae5ee7749ef4385b69e9a87461037de3f1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run matched 45-turn all-AI Normal games with the real engine
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLAYER" = britannia ]; then
            SEEDS=11,43,71,101,131,161,191,211,241,271
          else
            SEEDS=11,43,71,101,131
          fi
          if [ "$VERSION" = baseline ]; then
            git worktree add --detach /tmp/division-normal-baseline "$BASE_SHA"
            cp tools/division_japan_balance_sim.cjs /tmp/division-normal-baseline/tools/division_japan_balance_sim.cjs
            cd /tmp/division-normal-baseline
          fi
          node tools/division_japan_balance_sim.cjs "$PLAYER" normal "$SEEDS" 45 "$GITHUB_WORKSPACE/result-$VERSION-$PLAYER.json"
      - name: Print benchmark summary
        shell: bash
        run: |
          VERSION="$VERSION" PLAYER="$PLAYER" node - <<'NODE'
          const data = require('./result-'+process.env.VERSION+'-'+process.env.PLAYER+'.json');
          const rows=data.results;
          const powers=['britannia','eu','cf'];
          const mean=values=>Math.round(values.reduce((a,b)=>a+b,0)/values.length*100)/100;
          const median=values=>{if(!values.length)return null;const x=values.slice().sort((a,b)=>a-b);return x.length%2?x[(x.length-1)/2]:(x[x.length/2]+x[x.length/2-1])/2;};
          console.log('PAIRED_SUMMARY '+JSON.stringify({
            variant:process.env.VERSION,player:process.env.PLAYER,
            games:rows.length,eliminated:rows.filter(x=>x.playerEliminatedTurn!==null).length,
            eliminationTurns:rows.map(x=>x.playerEliminatedTurn),
            medianEliminationTurn:median(rows.map(x=>x.playerEliminatedTurn).filter(Number.isInteger)),
            endingCities:Object.fromEntries(powers.map(s=>[s,mean(rows.map(x=>x.end[s].cities))])),
            turn10Cities:Object.fromEntries(powers.map(s=>[s,mean(rows.map(x=>x.snapshots.find(p=>p.turn===10)?.counts[s].cities ?? x.end[s].cities))])),
            winners:Object.fromEntries(powers.map(s=>[s,rows.filter(x=>x.winner===s).length])),
            errors:rows.reduce((a,b)=>a+b.errorCount,0)
          }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: division-normal-${{ matrix.variant }}-${{ matrix.player }}
          path: result-*.json
          retention-days: 14
          if-no-files-found: warn