name: Conquest balance - 50 turns
on:
  push:
    branches: [main, 'feature/ai-multifront-defense-20261011']
    paths:
      - 'dist/engine/world.js'
      - 'src/ai/02-fronts.part.js'
      - 'src/ai/06-production.part.js'
      - 'src/engine/15-turns-and-fortresses.part.js'
      - 'dist/engine.js'
      - 'dist/engine/ai.js'
      - 'tools/balance_sim.cjs'
      - '.github/workflows/conquest-balance-50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    name: ${{ matrix.player }} seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        player: [britannia, eu, cf]
        seed: [42, 20261007]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source bundles and defensive AI regression
        run: |
          node tools/build_sources.cjs --check
      - name: Run 50-turn all-AI simulation
        run: |
          node tools/balance_sim.cjs --runs 1 --max-turns 50 --players "${{ matrix.player }}" --difficulties normal --seed "${{ matrix.seed }}" --snapshot-turns 10,20,30,40,50 --output balance-results.json --summary balance-summary.md --quiet --equal-ai
      - name: Summarize result
        run: cat balance-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: conquest-${{ matrix.player }}-${{ matrix.seed }}
          path: |
            balance-results.json
            balance-summary.md
          if-no-files-found: error
          retention-days: 14
