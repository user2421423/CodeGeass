name: Source/build synchronization
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm generated JavaScript matches source
        run: node tools/build_sources.cjs --check
      - name: Run existing core and scenario checks
        run: node --test tests/core.test.cjs tests/scenario.test.cjs
      - name: Run existing UI smoke checks
        run: node tests/ui-smoke.cjs
