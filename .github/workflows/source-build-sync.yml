name: Source/build synchronization
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Verify Elite class stats and abilities
        run: node tools/elite_class_standardization_smoke.cjs
      - name: Verify regular class standardization
        run: node tools/regular_class_standardization_smoke.cjs
      - name: Verify Story Mode Canterbury movement
        run: node tools/story_canterbury_movement_smoke.cjs
      - name: Verify HQ mobility research bonuses
        run: node tools/research_mobility_smoke.cjs
      - name: Verify six-branch HQ research
        run: node tools/research_branch_redesign_smoke.cjs
      - name: Verify research progression, counts, and fixed carrier capacity
        run: node tools/research_progression_smoke.cjs
      - name: Verify 200-level combat research effects
        run: node tools/research_200_combat_smoke.cjs
      - name: Verify commander roster and assignment
        run: node tools/commander_assignment_smoke.cjs
      - name: Verify manual repairs and port healing
        run: node tools/repair_and_port_healing_smoke.cjs
      - name: Verify research discounts on manual repair
        run: node tools/research_repair_discounts_smoke.cjs
      - name: Verify World Campaign Elite HQ levels
        run: node tools/world_campaign_elite_levels_smoke.cjs
      - name: Audit every Philippine hex and invasion route
        run: node tools/philippines_hex_audit.cjs

  australia-hex-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Independently audit every Australian hex and atlas alignment
        run: node tools/australia_hex_audit.cjs

  bering-map-and-hex-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Audit all 9,600 Bering land, sea and coastal hexes
        run: node tools/bering_hex_audit.cjs