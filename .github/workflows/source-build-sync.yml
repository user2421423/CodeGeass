name: Source/build synchronization
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Verify dynamic Scenario AI defensive transitions and Philippine exception
        run: node tools/scenario_dynamic_defense_smoke.cjs
      - name: Verify Elite class stats and abilities
        run: node tools/elite_class_standardization_smoke.cjs
      - name: Verify Elite rarities, faction parity and saved reward choices
        run: node tools/elite_rarity_by_class_smoke.cjs
      - name: Verify Amphibious Elite repeatable movement and attack chains
        run: node tools/amphibious_elite_chain_smoke.cjs
      - name: Verify city-defense movement refreshes and action limits
        run: node tools/city_defense_movement_refresh_smoke.cjs
      - name: Verify Elite fragment reward max-level safety
        run: node tools/elite_reward_max_level_smoke.cjs
      - name: Verify shared Elite loot boxes and rarity-safe level previews
        run: node tools/elite_lootboxes_smoke.cjs
      - name: Verify regular class standardization
        run: node tools/regular_class_standardization_smoke.cjs
      - name: Verify Story Mode Canterbury movement
        run: node tools/story_canterbury_movement_smoke.cjs
      - name: Verify Story Normal objectives, deployment and balance support
        run: node tools/story_normal_objectives_and_balance_smoke.cjs
      - name: Run seeded Story Normal detention-center gameplay viability probe
        run: node tools/story_normal_defense_ai_probe.cjs
      - name: Verify Story Elite deployment and faction-specific unit rosters
        run: node tools/story_elite_faction_roster_smoke.cjs
      - name: Verify starting Industry in all Story Mode missions and difficulties
        run: node tools/story_starting_industry_smoke.cjs
      - name: Verify HQ mobility research bonuses
        run: node tools/research_mobility_smoke.cjs
      - name: Verify standardized research prices and whole-campaign credits
        run: node tools/research_standardization_smoke.cjs
      - name: Verify six-branch HQ research
        run: node tools/research_branch_redesign_smoke.cjs
      - name: Verify research progression, counts, and fixed carrier capacity
        run: node tools/research_progression_smoke.cjs
      - name: Verify 200-level combat research effects
        run: node tools/research_200_combat_smoke.cjs
      - name: Verify commander roster and assignment
        run: node tools/commander_assignment_smoke.cjs
      - name: Verify commander skill refunds and development planning
        run: node tools/commander_progression_smoke.cjs
      - name: Verify victory tokens and Elite fragment progression
        run: node tools/reward_economy_smoke.cjs
      - name: Verify HQ Elite fragment purchases have no Story Mode prerequisites
        run: node tools/story_elite_unlock_smoke.cjs
      - name: Verify interactive tutorial mechanics and isolation
        run: node tools/interactive_tutorial_smoke.cjs
      - name: Verify all eleven tutorial academy drills
        run: node tools/tutorial_academy_smoke.cjs
      - name: Verify manual repairs and port healing
        run: node tools/repair_and_port_healing_smoke.cjs
      - name: Verify advanced frame Research pricing and AI purchasing
        run: node tools/frame_research_economy_smoke.cjs
      - name: Verify Division of Japan city income and repeated factory production
        run: node tools/division_income_factory_smoke.cjs
      - name: Verify every regional scenario uses city-based income and cityless invasion war chests
        run: node tools/regional_city_income_smoke.cjs
      - name: Verify World Campaign Elite HQ levels
        run: node tools/world_campaign_elite_levels_smoke.cjs
      - name: Verify World Campaign victory geography and territorial colors
        run: node tools/world_campaign_map_colors_smoke.cjs
      - name: Verify visible per-turn income in the battle HUD
        run: node tools/hud_income_display_smoke.cjs
      - name: Verify Next Unit includes actionable fortress beams
        run: node tools/next_unit_fortress_beam_smoke.cjs
      - name: Verify unlimited army-group membership and scenario organization
        run: node tools/army_group_unlimited_smoke.cjs
      - name: Verify direct city tier development and factory defense separation
        run: node tools/city_tier_upgrade_smoke.cjs
      - name: Audit every Philippine hex and invasion route
        run: node tools/philippines_hex_audit.cjs

  australia-hex-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Independently audit every Australian hex and atlas alignment
        run: node tools/australia_hex_audit.cjs

  bering-map-and-hex-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Audit all 9,600 Bering land, sea and coastal hexes
        run: node tools/bering_hex_audit.cjs