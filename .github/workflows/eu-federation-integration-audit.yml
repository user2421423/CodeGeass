name: EU Federation integration audit

on:
  pull_request:
    branches:
      - main

jobs:
  mechanics-and-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source
        run: node tools/build_sources.cjs
      - name: All 10 scenarios, both sides and all 4 difficulties
        run: node tools/eu_cf_validation.cjs --setup
      - name: Real model campaign wins, saves, tier locks, progression and isolation
        run: node tools/eu_cf_validation.cjs --progression
      - name: Asset validation
        run: node tools/validate_assets.cjs --tracked
      - name: Campaign architecture regression
        run: node tools/eu_federation_campaign_smoke.cjs
      - name: Existing World Campaign geographical checks
        run: node tools/world_campaign_map_colors_smoke.cjs
      - name: Existing World Campaign elite rewards
        run: node tools/world_campaign_elite_levels_smoke.cjs

  existing-gameplay-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source
        run: node tools/build_sources.cjs
      - name: Existing regional deterministic smoke, excluding new scenarios
        continue-on-error: true # Explicitly report pre-existing stale fingerprints; do not skip independent reward/economy tests.
        run: node tools/check_sim_baseline.cjs --scenarios division-japan,battle-luoyang,eu-greenland
      - name: Existing economy and conquest regression
        run: node tools/regional_city_income_smoke.cjs
      - name: Existing reward regression
        run: node tools/reward_economy_smoke.cjs
