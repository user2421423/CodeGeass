name: EU Federation integration audit

on:
  pull_request:
    branches:
      - main

jobs:
  mechanics-and-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source
        run: node tools/build_sources.cjs
      - name: Asset validation
        run: node tools/validate_assets.cjs --tracked
  existing-gameplay-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source
        run: node tools/build_sources.cjs