name: Area 18 scenario regression
on:
  push:
    branches: ['scenario/area-18', 'main']
    paths:
      - 'dist/area18-landmask.js'
      - 'dist/scenarios-area18.js'
      - 'dist/ui/geography.js'
      - 'tools/area18_*.cjs'
      - '.github/workflows/area18-scenario.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'dist/area18-landmask.js'
      - 'dist/scenarios-area18.js'
      - 'dist/ui/geography.js'
      - 'tools/area18_*.cjs'
      - 'dist/ui/scenario-screens.js'
      - 'dist/index.html'
      - 'src/ai/02-fronts.part.js'
      - 'dist/engine/ai.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  area18-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Hex-by-hex geographic audit
        run: node tools/area18_hex_audit.cjs
      - name: Validate tracked assets
        run: node tools/validate_assets.cjs --tracked
      - name: Validate world map parity
        run: python3 tools/check_map.py
      - name: 20-turn three-way simulation (17)
        timeout-minutes: 15
        run: node tools/scenario_sim.cjs area-18 britannia normal 17 20
      - name: 20-turn three-way simulation (29)
        timeout-minutes: 15
        run: node tools/scenario_sim.cjs area-18 eu hard 29 20
      - name: 20-turn three-way simulation (43)
        timeout-minutes: 15
        run: node tools/scenario_sim.cjs area-18 cf challenge 43 20
