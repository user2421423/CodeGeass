name: Restore verified commander portraits
on:
  push:
    branches: [main]
    paths:
      - 'tools/restore_missing_portraits.py'
      - '.github/workflows/restore-commander-portraits.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: pip install pillow requests
      - name: Download and crop identified character art
        run: python tools/restore_missing_portraits.py
      - name: Build and validate all published artwork
        run: |
          node tools/build_sources.cjs
          node tools/commander_portrait_audit.cjs --strict
          node tools/validate_assets.cjs --tracked
      - name: Commit recovered portraits to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/art/manifest.json dist/assets/art/manifest.js dist/assets/art/portraits tools/portrait-restoration-sources.json
          if git diff --cached --quiet; then
            echo "No new images"; exit 0
          fi
          git commit -m "Restore identified commander portraits from canonical art"
          git pull --rebase origin main
          git push origin HEAD:main
