name: Gameplay regression checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: gameplay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-fast
          path: gameplay-fast.tap
  deterministic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Run alternate-history AI movement and production simulations
        run: |
          node tools/scenario_sim.cjs rounds-rebellion rounds normal 11 3
          node tools/scenario_sim.cjs rounds-rebellion britannia normal 11 3
          node tools/scenario_sim.cjs shin-independence shinregime normal 11 3
          node tools/scenario_sim.cjs shin-independence britannia normal 11 3
          node tools/scenario_sim.cjs chinese-civil-war loyalists normal 11 3
          node tools/scenario_sim.cjs chinese-civil-war eunuchs normal 11 3
          node tools/scenario_sim.cjs eu-military-coup junta normal 11 3
          node tools/scenario_sim.cjs eu-military-coup eu normal 11 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-fingerprints
          path: gameplay-fingerprints.txt
