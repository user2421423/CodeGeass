name: Temporary sim baseline capture (Smilas rework)
# One-time Node capture of the 390-line fingerprint profile; removed before merge.
on:
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: head-a
            ref: ''
          - name: head-b
            ref: ''
          - name: pre-smilas-6f9ac77
            ref: 6f9ac777ac551da78051d11bb184bd0b29277a09
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture
        run: |
          set -euo pipefail
          node --version > node-version.txt
          git rev-parse HEAD > revision.txt
          node tools/build_sources.cjs
          ids="$(git show ${{ github.event.pull_request.head.sha }}:tools/data/sim_baseline.txt 2>/dev/null | awk '{print $2}' | sort -u || true)"
          if [ -z "$ids" ]; then git fetch -q origin ${{ github.event.pull_request.head.sha }} && ids="$(git show ${{ github.event.pull_request.head.sha }}:tools/data/sim_baseline.txt | awk '{print $2}' | sort -u)"; fi
          node tools/scenario_sim.cjs --all 11 2 $ids > fingerprints.txt
          wc -l fingerprints.txt
          sha256sum fingerprints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: capture-${{ matrix.name }}
          path: |
            fingerprints.txt
            node-version.txt
            revision.txt
