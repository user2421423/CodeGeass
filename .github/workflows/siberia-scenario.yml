name: Siberia scenario verification
on:
  push:
    branches:
      - scenario/britannia-siberia
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Exhaustive map and port audit
        run: node tools/siberia_hex_audit.cjs
      - name: Multiseed Britannia and E.U. AI turns
        run: |
          for side in britannia eu; do
            for seed in 11 29 47; do
              node tools/scenario_sim.cjs britannia-siberia "$side" normal "$seed" 3
            done
          done
          # Longer campaigns expose reinforcement, redeployment and strategic stalemates.
          node tools/scenario_sim.cjs britannia-siberia britannia normal 101 10
          node tools/scenario_sim.cjs britannia-siberia eu normal 101 10
