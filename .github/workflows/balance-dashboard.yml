name: Automated balance dashboard

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Depth: smoke (1 seed/8 turns), standard (3 seeds/30 turns), deep (5 seeds/50 turns)"
        type: choice
        options: [smoke, standard, deep]
        default: smoke
      baseline_ref:
        description: "Baseline commit or ref (default: parent of checked-out commit)"
        type: string
        required: false
      modes:
        description: "Comma-separated modes (2017,2018,invasion,division,europe)"
        type: string
        default: "2017,2018,invasion,division,europe"
  push:
    branches: [main]
    paths:
      - "tools/balance_dashboard*.cjs"
      - "tests/balance-dashboard.test.cjs"
      - ".github/workflows/balance-dashboard.yml"
      - "src/ai/**"
      - "dist/engine/ai.js"
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: balance-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate game and balance dashboard
        run: |
          node tools/build_sources.cjs --check
          node --test tests/balance-dashboard.test.cjs
          node --test tests/*.test.cjs
          node tests/ui-smoke.cjs
      - name: Determine paired simulation settings
        id: config
        env:
          SCOPE: ${{ inputs.scope }}
          REQUESTED_MODES: ${{ inputs.modes }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SCOPE" in
            smoke) RUNS=1; TURNS=8 ;;
            standard) RUNS=3; TURNS=30 ;;
            deep) RUNS=5; TURNS=50 ;;
            "") RUNS=1; TURNS=8 ;;
            *) echo "Invalid scope"; exit 1 ;;
          esac
          REF="$BASELINE_REF"
          if [ -z "$REF" ]; then REF="HEAD^"; fi
          BASE_SHA="$(git rev-parse --verify "$REF^{commit}")"
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
          echo "turns=$TURNS" >> "$GITHUB_OUTPUT"
          echo "baseline=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$REQUESTED_MODES" ]; then REQUESTED_MODES="2017,2018,invasion,division,europe"; fi
          echo "modes=$REQUESTED_MODES" >> "$GITHUB_OUTPUT"
      - name: Run baseline engine with identical reporting code
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/knightmare-baseline "${{ steps.config.outputs.baseline }}"
          cp tools/balance_dashboard.cjs tools/balance_dashboard_report.cjs /tmp/knightmare-baseline/tools/
          mkdir -p dashboard-output
          (
            cd /tmp/knightmare-baseline
            node tools/balance_dashboard.cjs \
              --modes "${{ steps.config.outputs.modes }}" \
              --runs "${{ steps.config.outputs.runs }}" \
              --max-turns "${{ steps.config.outputs.turns }}" \
              --difficulties normal --seed 20261007 \
              --output "$GITHUB_WORKSPACE/dashboard-output/baseline.json" \
              --html "$GITHUB_WORKSPACE/dashboard-output/baseline.html" \
              --summary "$GITHUB_WORKSPACE/dashboard-output/baseline.md"
          )
      - name: Run current engine and generate matched dashboard
        shell: bash
        run: |
          set -euo pipefail
          node tools/balance_dashboard.cjs \
            --modes "${{ steps.config.outputs.modes }}" \
            --runs "${{ steps.config.outputs.runs }}" \
            --max-turns "${{ steps.config.outputs.turns }}" \
            --difficulties normal --seed 20261007 \
            --baseline dashboard-output/baseline.json \
            --output dashboard-output/candidate.json \
            --html dashboard-output/index.html \
            --summary dashboard-output/comparison.md
          cat dashboard-output/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML, reports and raw telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-dashboard-${{ github.run_id }}
          path: dashboard-output/
          if-no-files-found: warn
          retention-days: 30
