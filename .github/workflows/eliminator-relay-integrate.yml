name: Reconcile Eliminator relay with latest main
on:
  push:
    branches: ['feature/eliminator-strategic-ai']
    paths: ['.github/workflows/eliminator-relay-integrate.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eliminator-strategic-ai
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Merge latest main into relay branch only and validate
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "PINNED_MAIN_SHA=$(git rev-parse origin/main)"
          git merge --no-ff -m "Reconcile latest main into Eliminator courier feature" origin/main
          echo "INTEGRATED_FEATURE_SHA=$(git rev-parse HEAD)"
          node tools/build_sources.cjs --check
          node --test tests/eliminator-carriers.test.cjs
          node --test tests/strategic-multifront.test.cjs
          git push origin HEAD:refs/heads/feature/eliminator-strategic-ai
