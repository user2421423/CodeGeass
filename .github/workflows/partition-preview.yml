name: Refresh Partition of Britannia previews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partition-preview.yml'
      - 'dist/scenarios-partition-britannia.js'
      - 'dist/scenarios-exclusive-common.js'
      - 'dist/partition-geography.js'
      - 'dist/ui/scenario-screens.js'
      - 'dist/scenario-previews/metadata.js'
      - 'dist/scenario-catalog.js'
      - 'dist/art.js'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: partition-preview-main
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the current game engine
        run: node tools/build_sources.cjs
      - name: Install headless browser dependency
        run: npm install --prefix /tmp/partition-playwright --no-save --no-package-lock playwright-core@1.57.0
      - name: Render the updated political map and refresh faction statistics
        env:
          NODE_PATH: /tmp/partition-playwright/node_modules
          SCENARIO_IDS: partition-britannia
        run: |
          node tools/generate-scenario-previews.cjs
          node tools/generate-hires-regional-maps.cjs
      - name: Verify current starting positions match the briefing
        run: |
          node tools/six_exclusive_smoke.cjs
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs'),vm=require('node:vm');
          const stat=vm.runInNewContext(fs.readFileSync('dist/scenario-previews/metadata.js','utf8')+';SCENARIO_STATIC_MAPS')['partition-britannia'];
          assert.equal(stat.cities,78);
          assert.equal(stat.formations,263);
          assert.deepEqual(JSON.parse(JSON.stringify(stat.sides)),{
            eu:{cities:30,formations:100},
            cf:{cities:21,formations:90},
            remnants:{cities:27,formations:73}
          });
          for(const dir of ['scenario-previews','scenario-hires']){
            const bytes=fs.readFileSync('dist/'+dir+'/partition-britannia.webp');
            assert.equal(bytes.toString('ascii',0,4),'RIFF');
            assert.equal(bytes.toString('ascii',8,12),'WEBP');
            console.log(dir+': '+bytes.length+' bytes');
          }
          NODE
      - name: Publish the refreshed static previews to main
        id: publish
        run: |
          git add -- dist/scenario-previews/partition-britannia.webp dist/scenario-hires/partition-britannia.webp dist/scenario-previews/metadata.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate Partition Britannia political preview and starting forces"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the refreshed artwork and briefing to GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
