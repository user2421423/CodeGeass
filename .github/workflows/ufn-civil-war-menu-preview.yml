name: Render mainland UFN Civil War menu map
on:
  push:
    branches:
      - ufn-civil-war-menu-mainland-20261021
    paths:
      - '.github/workflows/ufn-civil-war-menu-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-menu-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current game engine
        run: node tools/build_sources.cjs
      - name: Install headless browser
        run: npm install --prefix /tmp/ufn-menu-playwright --no-save --no-package-lock playwright-core@1.57.0
      - name: Render actual 119-city mainland map and refresh menu stats
        env:
          NODE_PATH: /tmp/ufn-menu-playwright/node_modules
          SCENARIO_IDS: ufn-civil-war
        run: node tools/generate-scenario-previews.cjs
      - name: Check mainland scenario and menu at desktop/mobile sizes
        env:
          NODE_PATH: /tmp/ufn-menu-playwright/node_modules
        run: |
          node tools/six_exclusive_smoke.cjs
          node tools/ufn_mainland_menu_browser.cjs
      - name: Commit refreshed WebP preview to the working branch
        run: |
          git add -- dist/scenario-previews/ufn-civil-war.webp dist/scenario-previews/metadata.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Render UFN Civil War's actual mainland China menu map"
            git push origin HEAD:ufn-civil-war-menu-mainland-20261021
          fi
