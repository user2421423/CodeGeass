name: Hex geography alignment audit
on:
  push:
    branches: [feature/map-hex-alignment]
    paths:
      - tools/map_alignment_audit.py
      - tools/audit_coastline_centres.py
      - tools/build_map.py
      - tools/data/map_locked.txt
      - dist/engine/world.js
      - dist/ui/geography.js
      - dist/ui/renderer.js
      - dist/ui/view.js
      - tests/ui-smoke.cjs
      - .github/workflows/map-alignment-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis-only geometry dependency
        run: python -m pip install shapely
      - name: Reproduce hex coverage audit
        run: |
          python tools/map_alignment_audit.py
          python tools/audit_coastline_centres.py
      - name: Validate snapshot and gameplay tests
        run: |
          python tools/check_map.py
          node --test tests/core.test.cjs
          node tests/ui-smoke.cjs
      - name: Validate approved conversion, safeguarded waterways and reproducible report
        run: |
          git diff --exit-code -- dist/engine/world.js tools/build_map.py tools/data/map_locked.txt
          python - <<'PY'
          import json
          j=json.load(open('docs/map-alignment-review.json'))
          assert j['summary']['hexes'] == 13680
          assert j['summary']['high_confidence_mismatches'] == 73
          c=json.load(open('docs/map-coastline-centre-review.json'))
          assert c['total_centre_conflicts'] == 483
          assert c['by_category']['mixed_coast_hex'] == 410
          assert c['by_category']['sea_hex_on_geographic_land'] == 40
          assert c['by_category']['land_hex_on_geographic_water'] == 33
          assert j['approved_for_gameplay_edit'] is False
          print('PASS: 73 strong conflicts, 483 centre mismatches classified after Newfoundland conversion')
          PY
          node - <<'JS'
          const assert=require('node:assert/strict');
          const E=require('./dist/engine.js'),g=E.createGame('britannia');
          const tile=(c,r)=>g.tiles[r*180+c];
          assert.notEqual(tile(61,15).terrain,'sea', 'Newfoundland must be land');
          for (const [c,r] of [[106,26],[107,27],[111,35],[140,43],[142,46]])
            assert.equal(tile(c,r).terrain,'sea', 'Protected waterway must remain navigable');
          assert.equal(g.stations.some(s=>s.c===61 && s.r===15),false);
          console.log('PASS: converted one low-risk land hex, strategic waterways unchanged');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: area-weighted-map-review
          path: |
            docs/map-alignment-review.json
            docs/map-coastline-centre-review.json
