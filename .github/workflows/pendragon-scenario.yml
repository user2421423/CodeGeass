name: Pendragon scenario verification
on:
  pull_request:
    paths:
      - 'dist/scenarios-pendragon.js'
      - 'tools/pendragon_hex_audit.cjs'
      - '.github/workflows/pendragon-scenario.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pendragon-runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game bundles
        run: node tools/build_sources.cjs
      - name: Check map geometry, city locations, all hexes, Army Groups and victory
        run: node tools/pendragon_hex_audit.cjs
      - name: Run multi-seed full-engine operational simulations
        run: |
          for side in eu britannia; do
            for seed in 11 29 47; do
              node tools/scenario_sim.cjs eu-pendragon "$side" normal "$seed" 2
            done
          done
          node tools/scenario_sim.cjs eu-pendragon eu hard 101 4
          node tools/scenario_sim.cjs eu-pendragon eu elite 103 2
