name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # After successful tests on the experimental branch, republish its preview.
  # workflow_run uses the workflow definition on main, so main's game stays live.
  workflow_run:
    workflows: ['Refactor regressions']
    branches: ['experiment/japan-no-hokkaido-rotate-25']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish the live game from main, even when a preview update
      # triggers this workflow.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run essential regression checks
        run: |
          node tools/build_sources.cjs --check
          node --test tests/*.test.cjs
          node tests/ui-smoke.cjs
          node tests/camera-zoom.test.cjs
          node tools/validate_assets.cjs --tracked
          python3 tools/check_map.py
      # Preview builds are isolated inside dist, with their own relative assets.
      # Never replace the main game's index.html or scripts.
      - name: Checkout experimental Japan branch
        uses: actions/checkout@v4
        with:
          ref: experiment/japan-no-hokkaido-rotate-25
          path: preview-source
          persist-credentials: false
      - name: Add playable Japan preview alongside the live game
        run: |
          test -f preview-source/dist/index.html
          test -f preview-source/dist/scenarios.js
          test -f preview-source/dist/ui/geography.js
          mkdir -p dist/previews/japan25
          cp -a preview-source/dist/. dist/previews/japan25/
          git -C preview-source rev-parse HEAD > dist/previews/japan25/preview-commit.txt
          test -f dist/index.html
          test -f dist/previews/japan25/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
