name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Validate the game and tracked public assets before deploying dist/.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check image preparation and decode published images
        run: |
          python -m pip install Pillow numpy
          python tests/art_pipeline_test.py
      - name: Check game rules, artwork loading, and public assets
        run: |
          node --test tests/*.test.cjs
          node tests/ui-smoke.cjs
          node tools/validate_assets.cjs --tracked
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
