name: Temporary branch ZIP export
on:
  push:
    branches:
      - feature/map-rendering-overhaul
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source ZIP
        run: |
          zip -qr "$RUNNER_TEMP/CodeGeass-map-rendering-overhaul.zip" . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: CodeGeass-map-rendering-overhaul
          path: ${{ runner.temp }}/CodeGeass-map-rendering-overhaul.zip
          compression-level: 0
