name: Partition of Britannia regression
on:
  push:
    paths:
      - 'dist/scenarios-partition-britannia.js'
      - 'dist/scenarios-exclusive-common.js'
      - 'dist/partition-geography.js'
      - 'dist/art.js'
      - 'dist/engine/frames.js'
      - 'tools/six_exclusive_smoke.cjs'
      - '.github/workflows/partition-britannia.yml'
  pull_request:
    paths:
      - 'dist/scenarios-partition-britannia.js'
      - 'dist/scenarios-exclusive-common.js'
      - 'dist/partition-geography.js'
      - 'dist/art.js'
      - 'dist/engine/frames.js'
      - 'tools/six_exclusive_smoke.cjs'
      - '.github/workflows/partition-britannia.yml'
permissions:
  contents: read
jobs:
  partition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scenario and flag JavaScript syntax
        run: |
          node --check dist/scenarios-partition-britannia.js
          node --check dist/art.js
          node --check tools/six_exclusive_smoke.cjs
      - name: Assemble engine and run faction and deployment smoke tests
        run: |
          node tools/build_sources.cjs
          node tools/six_exclusive_smoke.cjs
