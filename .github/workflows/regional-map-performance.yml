name: Regional map performance benchmark
on:
  push:
    branches: ['preview/map-render-performance']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build generated renderer bundles
        run: node tools/build_sources.cjs
      - name: Check JavaScript syntax
        run: |
          node --check dist/ui/geography.js
          node --check dist/ui/renderer.js
          node --check dist/scenarios-australia.js
          node --check dist/scenarios-california.js
      - name: Install headless browser driver
        run: npm install --prefix /tmp/perf-deps --no-save --no-package-lock playwright-core@1.57.0
      - name: Compare Australia, Japan and California
        env:
          NODE_PATH: /tmp/perf-deps/node_modules
          BENCHMARK_OUTPUT: regional-map-benchmark.json
        run: node tools/benchmark_regional_maps.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-map-performance
          path: regional-map-benchmark.json
          if-no-files-found: ignore
