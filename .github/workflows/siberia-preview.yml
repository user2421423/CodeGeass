name: Isolated Siberia playable preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: siberia-preview
      url: ${{ steps.deployment.outputs.page_url }}previews/siberia/
    steps:
      - name: Checkout branch preview
        uses: actions/checkout@v4
        with:
          path: siberia-src
      - name: Checkout unmodified production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Siberia source and map before publishing
        working-directory: siberia-src
        run: |
          node tools/build_sources.cjs --check
          node tools/siberia_hex_audit.cjs
      - name: Keep production main files intact and add isolated branch preview
        run: |
          mkdir -p main-site/dist/previews/siberia
          cp -a siberia-src/dist/. main-site/dist/previews/siberia/
          git -C siberia-src rev-parse HEAD > main-site/dist/previews/siberia/preview-commit.txt
          test -f main-site/dist/index.html
          test -f main-site/dist/previews/siberia/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
