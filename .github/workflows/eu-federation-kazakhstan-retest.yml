name: EU-Federation Kazakhstan seeded retest

on:
  push:
    paths:
      - '.github/workflows/eu-federation-kazakhstan-retest.yml'
    branches:
      - feature/eu-vs-federation-campaign-architecture
  workflow_dispatch:

jobs:
  full-engine-kazakhstan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build_sources.cjs
      - name: Verify AI supply corridor repair
        run: node --check dist/scenarios-eu-cf-kazakhstan.js
      - name: Multi-seed Kazakhstan replay (45 turns both sides)
        run: node tools/eu_federation_balance_matrix.cjs eu-cf-kazakhstan 45 11,37,91
