name: Bering Strait scenario regression
on:
  push:
    branches: ['feature/bering-strait-crisis']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenario-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and distribution parity
        run: node tools/build_sources.cjs --check
      - name: Bering and existing scenario regressions
        run: node --test tests/*.test.cjs
      - name: Four-turn AI versus AI Bering invasion playtest
        timeout-minutes: 12
        run: node tools/bering_sim.cjs 11 4
      - name: Browser UI smoke checks
        run: node tests/ui-smoke.cjs
