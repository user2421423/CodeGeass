name: Coastal 20-80 experiment checks
on:
  push:
    branches: ['feature/coastal-20-80-world-audit']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authoring-time geography dependency
        run: python -m pip install "shapely>=2.0"
      - name: Recheck generated geographic classification
        run: python3 tools/rebuild_coastal_20_80.py --check
      - name: Verify map generation and source bundles
        run: |
          python3 tools/check_map.py
          node tools/build_sources.cjs --check
      - name: Run regression tests
        run: |
          node --test tests/*.test.cjs
          node tests/ui-smoke.cjs
          node tests/camera-zoom.test.cjs
          node tools/validate_assets.cjs --tracked
      - name: Report experimental city and port displacement
        if: always()
        run: node tools/audit_coastal_starting_positions.cjs
