name: Temporary map rendering QA package
on:
  push:
    branches: [feature/map-rendering-overhaul]
    paths:
      - .github/workflows/temporary-map-render-qa.yml
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game and validate map
        run: |
          node --check dist/ui/geography-data.js
          node --check dist/ui/geography.js
          node --check dist/ui/renderer.js
          node --test tests/core.test.cjs
          node tests/ui-smoke.cjs
          node tools/validate_assets.cjs --tracked
          python3 tools/check_map.py
      - name: Package tested branch
        run: |
          zip -qr "$RUNNER_TEMP/CodeGeass-global-map-overhaul.zip" . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: CodeGeass-global-map-overhaul
          path: ${{ runner.temp }}/CodeGeass-global-map-overhaul.zip
          compression-level: 0
