name: Refresh every regional map backdrop

on:
  push:
    branches: [main]
    paths:
      - 'dist/ui/geography.js'
      - 'src/renderer/04-map-caching.part.js'
      - 'dist/scenarios-partition-britannia.js'
      - '.github/workflows/refresh-regional-terrain.yml'
  workflow_dispatch:

permissions:
  contents: write

# Do not race the dedicated Partition exporter when both files change.
concurrency:
  group: partition-preview-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game scripts from source
        run: node tools/build_sources.cjs
      - name: Install headless browser
        run: npm install --prefix /tmp/terrain-deps --no-save --no-package-lock playwright-core@1.57.0
      - name: Regenerate ALL geographic scenario images at both resolutions
        env:
          NODE_PATH: /tmp/terrain-deps/node_modules
        run: |
          node tools/generate-hires-regional-maps.cjs
          node tools/generate-scenario-previews.cjs
      - name: Commit refreshed map images and scenario metadata to main
        run: |
          git add -- dist/scenario-hires/ dist/scenario-previews/
          if git diff --cached --quiet; then
            echo "All map images already match the renderer."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate all scenario maps after relief and seam fixes"
            git restore --worktree -- .
            git pull --rebase origin main
            git push origin HEAD:main
          fi
