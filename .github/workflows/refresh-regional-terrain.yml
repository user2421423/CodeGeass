name: Refresh regional terrain backdrops

on:
  push:
    branches: [main]
    paths:
      - 'dist/ui/geography.js'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-regional-terrain-backdrops
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game scripts from source
        run: node tools/build_sources.cjs
      - name: Install headless browser
        run: npm install --prefix /tmp/terrain-deps --no-save --no-package-lock playwright-core@1.57.0
      - name: Regenerate only the affected troop-free scenario maps
        env:
          NODE_PATH: /tmp/terrain-deps/node_modules
          SCENARIO_IDS: cf-new-zealand,cf-pacific-northwest,cf-eu-central-europe
        run: |
          node tools/generate-hires-regional-maps.cjs
          node tools/generate-scenario-previews.cjs
      - name: Commit regenerated map assets to main
        id: save
        run: |
          git add -- \
            dist/scenario-hires/cf-new-zealand.webp \
            dist/scenario-hires/cf-pacific-northwest.webp \
            dist/scenario-hires/cf-eu-central-europe.webp \
            dist/scenario-previews/cf-new-zealand.webp \
            dist/scenario-previews/cf-pacific-northwest.webp \
            dist/scenario-previews/cf-eu-central-europe.webp
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh regional map backdrops for updated geography"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy updated game images
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
