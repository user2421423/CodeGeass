name: Eliminator defense production versus anchors ablation
on:
  push:
    branches: ['experiment/eliminator-2017-production-only']
    paths: ['.github/workflows/eliminator-production-anchor-ablation.yml']
  pull_request:
    branches: ['experiment/eliminator-launch-diagnostics']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/build_sources.cjs --check
      - run: node --test tests/*.test.cjs
      - run: node tests/ui-smoke.cjs
  compare:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {mode: '2017', seed: 401, turns: 45}
          - {mode: '2017', seed: 777, turns: 45}
          - {mode: '2017', seed: 13579, turns: 45}
          - {mode: '2017', seed: 20261007, turns: 45}
          - {mode: '2017', seed: 42, turns: 45}
          - {mode: '2017', seed: 246801, turns: 45}
          - {mode: '2017', seed: 8675309, turns: 45}
          - {mode: '2017', seed: 1234567, turns: 45}
          - {mode: '2017', seed: 314159, turns: 45}
          - {mode: '2017', seed: 271828, turns: 45}
          - {mode: '2017', seed: 9001, turns: 45}
          - {mode: '2017', seed: 8080, turns: 45}
          - {mode: '2017', seed: 55555, turns: 45}
          - {mode: '2017', seed: 67891, turns: 45}
          - {mode: '2017', seed: 99991, turns: 45}
          - {mode: '2017', seed: 424242, turns: 45}
          - {mode: '2017', seed: 77777, turns: 45}
          - {mode: '2017', seed: 606060, turns: 45}
          - {mode: '2017', seed: 31415, turns: 45}
          - {mode: '2017', seed: 9999, turns: 45}
          - {mode: '2018', seed: 401, turns: 35}
          - {mode: '2018', seed: 777, turns: 35}
          - {mode: '2018', seed: 13579, turns: 35}
          - {mode: '2018', seed: 20261007, turns: 35}
          - {mode: '2018', seed: 42, turns: 35}
          - {mode: '2018', seed: 246801, turns: 35}
    name: ${{ matrix.mode }} seed ${{ matrix.seed }} 4-way ablation
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: 4-way matched AI-only comparison with 2018 neutrality
        env:
          MODE: ${{ matrix.mode }}
          SEED: ${{ matrix.seed }}
          TURNS: ${{ matrix.turns }}
          ELIMINATOR_TARGET_DIAGNOSTICS: '1'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin experiment/eliminator-2017-anchors-only experiment/eliminator-forward-city-2017-only
          node tools/eliminator_ab_sim.cjs "$MODE" "$SEED" "$TURNS" forward-production-only > production.json
          git show a96329bbd1bb1d10626751c7a4229a8f32c6a011:dist/engine/ai.js > dist/engine/ai.js
          node tools/eliminator_ab_sim.cjs "$MODE" "$SEED" "$TURNS" anchor-only > anchors.json
          git show 9e070cd77d5ac7a7cb37100fb94d3c787ec5834d:dist/engine/ai.js > dist/engine/ai.js
          node tools/eliminator_ab_sim.cjs "$MODE" "$SEED" "$TURNS" previous-combined > combined.json
          git show 6e452e5ca7f3148c9392d37701c1e93897a3386e:dist/engine/ai.js > dist/engine/ai.js
          node tools/eliminator_ab_sim.cjs "$MODE" "$SEED" "$TURNS" original-baseline > baseline.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const files={baseline:'baseline.json',production:'production.json',
            anchors:'anchors.json',combined:'combined.json'};
          const data=Object.fromEntries(Object.entries(files).map(([k,f])=>
            [k,JSON.parse(fs.readFileSync(f,'utf8'))]));
          for(const [k,r] of Object.entries(data)){
            assert.equal(r.warheads,r.diagnostics.launches,k+' launch accounting');
            assert.equal(r.diagnostics.coveredButMissed,0,k+' missed defense');
          }
          const keys=['warheads','intercepted','carrierIntercepts','cityIntercepts',
            'chargesStarted','pickedUp','carrierLosses','armyValueProtectionRate',
            'frontlineValueProtectionRate','weightedProtectionRate','elapsedMs'];
          if(data.baseline.mode==='2018'){
            const exact=['warheads','intercepted','carrierIntercepts',
              'cityIntercepts','chargesStarted','pickedUp','carrierLosses',
              'armyValueProtectionRate','frontlineValueProtectionRate',
              'weightedProtectionRate','actions','finalCities','finalUnits'];
            for(const k of ['production','anchors','combined']){
              for(const field of exact)assert.deepEqual(data[k][field],
                data.baseline[field],k+' 2018 '+field);
            }
            console.log('2018_FOUR_WAY_NEUTRALITY_OK '+data.baseline.seed);
          }
          console.log('DEFENSE_ABLATION_COMPARE '+JSON.stringify({
            mode:data.baseline.mode,seed:data.baseline.seed,
            metrics:Object.fromEntries(keys.map(key=>[key,
              Object.fromEntries(Object.entries(data).map(([variant,d])=>[variant,d[key]]))]))
          }));
          NODE
