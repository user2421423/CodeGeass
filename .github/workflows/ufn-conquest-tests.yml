name: UFN 2018 conquest regression
on:
  push:
    branches: ['feature/ufn-conquest-2018-20261012']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm source sections match production bundles
        run: node tools/build_sources.cjs --check
      - name: Test engine, scenarios, saves, Elite and UI
        run: node --test tests/*.test.cjs
      - name: UI smoke, assets, and coastline checks
        run: |
          node tests/ui-smoke.cjs
          node tools/validate_assets.cjs --tracked
          python3 tools/check_map.py
      - name: Simulate UFN openings and report military/economic balance
        run: node tools/ufn2018_smoke.cjs
