name: Scenario Defense Variant Screen
on:
  push:
    branches: [feature/scenario-dynamic-defense-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tools/build_sources.cjs
          node --check dist/engine/ai.js
          node tools/scenario_dynamic_defense_smoke.cjs
          AI_VERSION=combined node tools/scenario_ai_eval.cjs war-for-australia britannia normal 11 2
  compare:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [main, old, selective, preserve, production, combined]
        scenario:
          - { id: war-for-australia, player: britannia, difficulty: normal, turns: 60 }
          - { id: division-japan, player: britannia, difficulty: hard, turns: 50 }
          - { id: invasion-japan, player: britannia, difficulty: challenge, turns: 50 }
          - { id: european-war, player: eu, difficulty: normal, turns: 35 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 187fd0531b383bceaead0682d3db10e689dc8ce6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin original main for control
        if: matrix.profile == 'main'
        run: |
          cp tools/scenario_ai_eval.cjs /tmp/scenario_ai_eval.cjs
          git fetch --depth=1 origin ce0b53b07159b8e3930e74374eeb40ec3faa47fd
          git checkout --detach FETCH_HEAD
          cp /tmp/scenario_ai_eval.cjs tools/scenario_ai_eval.cjs
      - name: Build and compile profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          node tools/build_sources.cjs
          if [ "$PROFILE" != "main" ]; then node tools/scenario_ai_variant.cjs "$PROFILE"; fi
          node --check dist/engine/ai.js
      - name: Paired seeded AI benchmark
        env:
          PROFILE: ${{ matrix.profile }}
          ID: ${{ matrix.scenario.id }}
          PLAYER: ${{ matrix.scenario.player }}
          DIFFICULTY: ${{ matrix.scenario.difficulty }}
          TURNS: ${{ matrix.scenario.turns }}
        run: |
          for SEED in 11 37 59 83; do
            AI_VERSION="$PROFILE" node tools/scenario_ai_eval.cjs "$ID" "$PLAYER" "$DIFFICULTY" "$SEED" "$TURNS"
          done
