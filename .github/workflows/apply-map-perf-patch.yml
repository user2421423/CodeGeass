name: Apply and verify map rendering cache
on:
  push:
    branches: [feature/map-rendering-overhaul]
    paths: [tools/apply-map-perf-patch.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install patch codec
        run: python -m pip install brotli
      - name: Apply reviewed rendering patch
        run: python tools/apply-map-perf-patch.py
      - name: Syntax, gameplay and map checks
        run: |
          node --check dist/ui/geography.js
          node --check dist/ui/renderer.js
          node --test tests/core.test.cjs
          node tests/ui-smoke.cjs
          python3 tools/check_map.py
      - name: Commit tested changes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ui/geography.js dist/ui/renderer.js
          if ! git diff --cached --quiet; then
            git commit -m "Fill geographic territory gaps and cache map tiles for smooth panning"
            git push origin HEAD:feature/map-rendering-overhaul
          fi
