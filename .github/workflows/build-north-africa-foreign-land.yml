name: Build regional geographic landmasks

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_north_africa_foreign_mask.py'
      - 'tools/build_suez_foreign_mask.py'
      - 'tools/build_france_foreign_mask.py'
      - 'tools/build_beijing_landmask.py'
      - 'tools/build_korea_foreign_mask.py'
      - 'tools/build_caucasus_watermask.py'
      - '.github/workflows/build-north-africa-foreign-land.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: north-africa-foreign-land-main
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch geographic reference
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson \
            -o /tmp/north-africa-countries.geojson
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_land.geojson \
            -o /tmp/natural-earth-land.geojson
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_lakes.geojson \
            -o /tmp/natural-earth-lakes.geojson
      - name: Rasterize foreign land into North Africa, Suez and France
        run: |
          python3 tools/build_north_africa_foreign_mask.py /tmp/north-africa-countries.geojson
          python3 tools/build_suez_foreign_mask.py /tmp/north-africa-countries.geojson
          python3 tools/build_france_foreign_mask.py /tmp/north-africa-countries.geojson
          python3 tools/build_beijing_landmask.py /tmp/natural-earth-land.geojson
          python3 tools/build_korea_foreign_mask.py /tmp/north-africa-countries.geojson
          python3 tools/build_caucasus_watermask.py /tmp/natural-earth-land.geojson /tmp/natural-earth-lakes.geojson
      - name: Rebuild and audit every scenario before pushing
        run: |
          node tools/build_sources.cjs
          node tools/audit_all_scenario_hexes.cjs /tmp/natural-earth-land.geojson
          node - <<'NODE'
          const E=require('./dist/engine.js');
          require('./tools/scenario_sim.cjs');
          const m=E.scenarios.byId['cf-eu-north-africa'];
          for(const side of m.sides){
            const g=m.create(side,'normal',20261022);
            const offmap=g.tiles.filter(t=>t.terrain==='offmap').length;
            const ownedOffmap=g.tiles.filter(t=>t.terrain==='offmap'&&t.owner!==null).length;
            const illegalShips=g.units.filter(u=>E.TYPES[u.type]?.naval==='ship'&&!E.TYPES[u.type]?.air&&
              !['sea','coast'].includes(E.tile(g,u.c,u.r)?.terrain));
            if(offmap<200||ownedOffmap||illegalShips.length)
              throw Error('North African foreign land/naval check '+JSON.stringify({side,offmap,ownedOffmap,illegalShips:illegalShips.length}));
            console.log('NORTH_AFRICA_FOREIGN_LAND '+JSON.stringify({side,offmap,ports:g.stations.filter(s=>s.portAt).length}));
          }
          const suez=E.scenarios.byId['cf-eu-suez'];
          for(const side of suez.sides){
            const g=suez.create(side,'normal',20261022);
            const offmap=g.tiles.filter(t=>t.terrain==='offmap').length;
            const ownedOffmap=g.tiles.filter(t=>t.terrain==='offmap'&&t.owner!==null).length;
            const illegalShips=g.units.filter(u=>E.TYPES[u.type]?.naval==='ship'&&!E.TYPES[u.type]?.air&&
              !['sea','coast'].includes(E.tile(g,u.c,u.r)?.terrain));
            if(offmap<100||ownedOffmap||illegalShips.length)
              throw Error('Suez foreign land/naval check '+JSON.stringify({side,offmap,ownedOffmap,illegalShips:illegalShips.length}));
            console.log('SUEZ_FOREIGN_LAND '+JSON.stringify({side,offmap,ports:g.stations.filter(s=>s.portAt).length}));
          }
          const france=E.scenarios.byId['cf-eu-france'];
          for(const side of france.sides){
            const g=france.create(side,'normal',20261022);
            const foreignOffmap=g.tiles.filter(t=>t.terrain==='offmap').length;
            const illegalShips=g.units.filter(u=>E.TYPES[u.type]?.naval==='ship'&&!E.TYPES[u.type]?.air&&
              !['sea','coast'].includes(E.tile(g,u.c,u.r)?.terrain));
            if(foreignOffmap<100||illegalShips.length)
              throw Error('France foreign land/naval check '+JSON.stringify({side,foreignOffmap,illegalShips:illegalShips.length}));
            console.log('FRANCE_FOREIGN_LAND '+JSON.stringify({side,offmap:foreignOffmap,ports:g.stations.filter(s=>s.portAt).length}));
          }
          const beijing=E.scenarios.byId['eu-cf-beijing'];
          for(const side of beijing.sides){
            const g=beijing.create(side,'normal',20261022);
            const sea=g.tiles.filter(t=>t.terrain==='sea').length;
            const coast=g.tiles.filter(t=>t.terrain==='coast').length;
            const ships=g.units.filter(u=>E.TYPES[u.type]?.naval==='ship'&&!E.TYPES[u.type]?.air&&
              !['sea','coast'].includes(E.tile(g,u.c,u.r)?.terrain));
            if(sea<2500||coast<40||ships.length)
              throw Error('Beijing geographic shoreline check '+JSON.stringify({side,sea,coast,ships:ships.length}));
            console.log('BEIJING_GEOGRAPHIC_SHORE '+JSON.stringify({side,sea,coast,ports:g.stations.filter(s=>s.portAt).length}));
          }
          const korea=E.scenarios.byId['invasion-korea'];
          for(const side of korea.sides){
            const g=korea.create(side,'normal',20261022);
            const outside=g.tiles.filter(t=>t.terrain==='offmap').length;
            const owned=g.tiles.filter(t=>t.terrain==='offmap'&&t.owner!=null).length;
            const illegalShips=g.units.filter(u=>E.TYPES[u.type]?.naval==='ship'&&!E.TYPES[u.type]?.air&&
              !['sea','coast'].includes(E.tile(g,u.c,u.r)?.terrain));
            if(outside<100||owned||illegalShips.length)
              throw Error('Korea foreign mainland check '+JSON.stringify({side,outside,owned,illegalShips:illegalShips.length}));
            console.log('KOREA_FOREIGN_MAINLAND '+JSON.stringify({side,outside,ports:g.stations.filter(s=>s.portAt).length}));
          }
          const caucasus=E.scenarios.byId['cf-eu-caucasus'];
          for(const side of caucasus.sides){
            const g=caucasus.create(side,'normal',20261022);
            const basins=new Set(g.tiles.filter(t=>t.terrain==='sea').map(t=>t.waterBasin));
            const invalid=g.units.filter(u=>E.TYPES[u.type]?.naval==='ship'&&!E.TYPES[u.type]?.air&&
              !['sea','coast'].includes(E.tile(g,u.c,u.r)?.terrain));
            const correct=g.stations.filter(s=>s.portAt).every(s=>{
              const t=E.tile(g,s.portAt.c,s.portAt.r);
              return (['Batumi','Poti','Sochi','Tuapse','Novorossiysk'].includes(s.name)?'black-sea':'caspian')===t.waterBasin;
            });
            if(!basins.has('caspian')||!basins.has('black-sea')||invalid.length||!correct)
              throw Error('Caucasus split sea basin check '+JSON.stringify({side,basins:[...basins],illegalShips:invalid.length,portsCorrect:correct}));
            console.log('CAUCASUS_SEA_BASINS '+JSON.stringify({side,sea:g.tiles.filter(t=>t.terrain==='sea').length,coast:g.tiles.filter(t=>t.terrain==='coast').length,ports:g.stations.filter(s=>s.portAt).length}));
          }
          NODE
      - name: Commit verified landmasks to main
        run: |
          git add dist/scenarios-cf-eu-north-africa.js dist/scenarios-cf-eu-suez.js dist/scenarios-cf-eu-france.js dist/scenarios-eu-cf-beijing.js dist/scenarios-korea.js dist/scenarios-cf-eu-caucasus.js
          if git diff --cached --quiet; then
            echo 'Foreign landmask already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Fix Korea foreign land and both Caucasus sea basins using independent geography"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
