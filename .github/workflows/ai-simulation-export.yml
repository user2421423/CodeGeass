name: AI simulation source archive
on:
  pull_request:
    paths:
      - '.github/workflows/ai-simulation-export.yml'
      - 'src/ai/**'
      - 'tools/ai_economy*'
      - 'tools/scenario_sim.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/checkout@v4
        with:
          path: candidate
      - name: Prepare a pair of exact revision snapshots for offline simulations
        run: |
          tar --exclude='.git' --exclude='dist/assets' --exclude='dist/ui' --exclude='dist/art.js' -czf economy-simulation-sources.tar.gz baseline candidate
          du -h economy-simulation-sources.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ai-economy-simulation-sources
          path: economy-simulation-sources.tar.gz
