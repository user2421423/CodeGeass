name: Division Japan full regression checks
on:
  push:
    branches: ['feature/division-japan-britannia-normal-balance-20261013']
    paths:
      - '.github/workflows/division-japan-full-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source/build synchronization
        run: node tools/build_sources.cjs --check
      - name: Run every Node regression test
        run: node --test tests/*.test.cjs
      - name: Run UI smoke checks
        run: node tests/ui-smoke.cjs