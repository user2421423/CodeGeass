name: Eliminator pre-merge reconciliation audit
on:
  push:
    branches: ['feature/eliminator-strategic-ai']
    paths: ['.github/workflows/eliminator-integration-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry-run merging latest main into feature branch
        shell: bash
        run: |
          set +e
          git fetch origin main
          git config user.email "reconciliation-audit@users.noreply.github.com"
          git config user.name "Reconciliation audit"
          git merge --no-commit --no-ff origin/main > merge-log.txt 2>&1
          result=$?
          cat merge-log.txt
          if [ "$result" -ne 0 ]; then
            echo 'CONFLICT_FILES_START'
            git diff --name-only --diff-filter=U
            echo 'CONFLICT_FILES_END'
            exit 1
          fi
          echo 'MERGE_CLEAN'
          node tools/build_sources.cjs --check
          node --test tests/eliminator-carriers.test.cjs
          node --test tests/strategic-multifront.test.cjs
