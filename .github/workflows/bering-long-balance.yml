name: Bering long-run balance
on:
  push:
    branches: ['feature/bering-strait-crisis']
    paths:
      - 'tools/bering_long_balance.cjs'
      - '.github/workflows/bering-long-balance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { player: britannia, seed: 11 }
          - { player: eu, seed: 11 }
          - { player: britannia, seed: 43 }
          - { player: eu, seed: 43 }
          - { player: britannia, seed: 79 }
          - { player: eu, seed: 79 }
          - { player: britannia, seed: 131 }
          - { player: eu, seed: 131 }
    name: ${{ matrix.player }} seed ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Long-run 50-turn all-AI scenario
        timeout-minutes: 30
        run: node tools/bering_long_balance.cjs ${{ matrix.seed }} 50 ${{ matrix.player }} normal
