name: Story Mode Season 1 balance audit
on:
  push:
    branches: [main]
    paths:
      - 'src/missions/**'
      - 'src/engine/**'
      - 'src/ai/**'
      - 'dist/campaign.js'
      - 'tools/story_r2_balance_probe.cjs'
      - '.github/workflows/story-s1-balance.yml'
  pull_request:
    paths:
      - 'src/missions/**'
      - 'src/engine/**'
      - 'src/ai/**'
      - 'dist/campaign.js'
      - 'tools/story_r2_balance_probe.cjs'
      - '.github/workflows/story-s1-balance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  season-one-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build_sources.cjs